name: user_app
description: "Hookah Order User App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  graphql_flutter: ^5.1.2
  yandex_mapkit: ^4.2.1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  geolocator: ^13.0.2
  http: ^1.2.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.13.1
  firebase_analytics: ^11.4.6
  firebase_messaging: ^15.2.5
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/splash.png
    - assets/marker.png
    - assets/marker_user.png